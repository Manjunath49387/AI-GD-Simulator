<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In & Register — GD Simulator</title>
  <meta name="description" content="Sign in or register for GD Simulator. Cloud authentication powered by Supabase with enterprise security." />
  <link rel="stylesheet" href="/css/main.css" />
  <!-- Supabase JS Client library from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px 16px;
      position: relative;
    }

    .auth-wrapper {
      width: 100%;
      max-width: 480px;
      z-index: 1;
    }

    .auth-brand {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-mark {
      width: 52px;
      height: 52px;
      border-radius: var(--radius-lg);
      background: var(--accent-gradient);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      box-shadow: 0 0 28px rgba(79, 70, 229, 0.45);
      color: #ffffff;
    }

    .brand-mark svg {
      width: 28px;
      height: 28px;
    }

    .auth-brand h1 {
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      color: var(--text-primary);
    }

    .auth-brand p {
      font-size: 0.86rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      padding: 32px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: var(--shadow-lg), var(--shadow-inset-top);
      position: relative;
    }

    /* Supabase status banner */
    .supabase-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 0.72rem;
      font-weight: 600;
      margin-bottom: 16px;
      width: fit-content;
      transition: all var(--transition-fast);
    }
    .supabase-badge.connected {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
    }
    .supabase-badge.local {
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.25);
      color: var(--accent-tertiary);
    }
    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    /* Tab Switcher */
    .tab-nav {
      display: flex;
      background: rgba(10, 15, 29, 0.75);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 4px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 9px 14px;
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--font-primary);
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-fast);
      background: transparent;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .tab-btn.active {
      background: var(--accent-gradient);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .tab-panel {
      display: none;
      animation: fadeIn 0.25s ease;
    }
    .tab-panel.active {
      display: block;
    }

    /* OAuth Social Buttons */
    .oauth-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }

    .btn-oauth {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 12px;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      color: var(--text-primary);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-fast);
      font-family: var(--font-primary);
    }

    .btn-oauth:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    .btn-oauth svg {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
    }

    .auth-divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 18px 0;
      color: var(--text-muted);
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--glass-border-subtle);
    }
    .auth-divider:not(:empty)::before {
      margin-right: .75em;
    }
    .auth-divider:not(:empty)::after {
      margin-left: .75em;
    }

    /* Multi-User Fast Switch Styles */
    .multi-user-box {
      background: rgba(var(--accent-rgb, 13, 148, 136), 0.08);
      border: 1px solid var(--glass-border-hover);
      border-radius: var(--radius-lg);
      padding: 12px 14px;
      margin-bottom: 20px;
    }
    .multi-user-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .multi-user-title {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.01em;
    }
    .multi-user-hint {
      font-size: 0.68rem;
      color: var(--text-accent);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .candidate-quick-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .candidate-quick-card {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: var(--radius-md);
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      cursor: pointer;
      transition: all var(--transition-fast);
      text-align: left;
    }
    .candidate-quick-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-focus);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(var(--accent-rgb, 13, 148, 136), 0.2);
    }
    .c-avatar {
      width: 26px;
      height: 26px;
      border-radius: var(--radius-full);
      background: var(--accent-gradient);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 700;
      flex-shrink: 0;
    }
    .c-info {
      flex: 1;
      min-width: 0;
    }
    .c-name {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .c-role {
      font-size: 0.66rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .c-action {
      font-size: 0.7rem;
      color: var(--text-accent);
      font-weight: 700;
      opacity: 0;
      transition: opacity var(--transition-fast);
      flex-shrink: 0;
    }
    .candidate-quick-card:hover .c-action {
      opacity: 1;
    }

    .auth-footer {
      margin-top: 22px;
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .auth-footer a {
      color: var(--accent-tertiary);
      text-decoration: none;
      transition: color var(--transition-fast);
    }
    .auth-footer a:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    .input-svg-icon {
      width: 16px;
      height: 16px;
      stroke-width: 2;
    }
  </style>
</head>
<body>

<div class="auth-wrapper">
  <!-- Brand Header -->
  <div class="auth-brand">
    <a href="/index.html" style="text-decoration: none; display: inline-block;">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" x2="12" y1="19" y2="22"/>
        </svg>
      </div>
    </a>
    <h1>GD Simulator</h1>
    <p>Secure Candidate Portal & Evaluation Engine</p>
  </div>

  <div class="auth-card">
    <!-- Status Badge -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <div id="auth-status-badge" class="supabase-badge local">
        <span class="badge-dot"></span>
        <span id="badge-text">Connecting Auth...</span>
      </div>
      <a href="/index.html" style="font-size: 0.75rem; color: var(--text-muted); text-decoration: none;">← Back to Home</a>
    </div>

    <!-- Tab Navigation -->
    <div class="tab-nav" role="tablist">
      <button class="tab-btn active" id="login-tab" onclick="switchTab('login')" role="tab">
        <svg class="input-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9"/></svg>
        Sign In
      </button>
      <button class="tab-btn" id="register-tab" onclick="switchTab('register')" role="tab">
        <svg class="input-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M18 7.5v3m0 0v3m0-3h3m-3 0h-3m-2.25-4.125a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zM3 19.235v-.11a6.375 6.375 0 0112.75 0v.109A12.318 12.318 0 013 19.235z"/></svg>
        Create Account
      </button>
    </div>

    <!-- Social OAuth Buttons (Supabase) -->
    <div class="oauth-grid" id="oauth-container">
      <button type="button" class="btn-oauth" onclick="handleOAuthLogin('google')" id="btn-oauth-google" title="Sign in with Google">
        <svg viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Google</span>
      </button>

      <button type="button" class="btn-oauth" onclick="handleOAuthLogin('github')" id="btn-oauth-github" title="Sign in with GitHub">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
        </svg>
        <span>GitHub</span>
      </button>
    </div>

    <div class="auth-divider">or continue with email</div>

    <!-- Multi-User Fast Sign-In Box -->
    <div class="multi-user-box">
      <div class="multi-user-header">
        <div class="multi-user-title">
          <svg style="width:15px;height:15px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          Multi-User Fast Sign-In
        </div>
        <span class="multi-user-hint">1-Click Sign In</span>
      </div>
      <div class="candidate-quick-grid">
        <button type="button" class="candidate-quick-card" onclick="quickLoginCandidate('demo@gd.com', 'Alex Morgan')" title="Sign in as Alex Morgan">
          <div class="c-avatar">A</div>
          <div class="c-info">
            <div class="c-name">Alex Morgan</div>
            <div class="c-role">Tech • Score 83%</div>
          </div>
          <span class="c-action">Login →</span>
        </button>
        <button type="button" class="candidate-quick-card" onclick="quickLoginCandidate('sarah@gd.com', 'Sarah Chen')" title="Sign in as Sarah Chen">
          <div class="c-avatar">S</div>
          <div class="c-info">
            <div class="c-name">Sarah Chen</div>
            <div class="c-role">Consulting • Score 86%</div>
          </div>
          <span class="c-action">Login →</span>
        </button>
        <button type="button" class="candidate-quick-card" onclick="quickLoginCandidate('rahul@gd.com', 'Rahul Sharma')" title="Sign in as Rahul Sharma">
          <div class="c-avatar">R</div>
          <div class="c-info">
            <div class="c-name">Rahul Sharma</div>
            <div class="c-role">Engineering • Score 76%</div>
          </div>
          <span class="c-action">Login →</span>
        </button>
        <button type="button" class="candidate-quick-card" onclick="quickLoginCandidate('priya@gd.com', 'Priya Patel')" title="Sign in as Priya Patel">
          <div class="c-avatar">P</div>
          <div class="c-info">
            <div class="c-name">Priya Patel</div>
            <div class="c-role">Product • Score 89%</div>
          </div>
          <span class="c-action">Login →</span>
        </button>
      </div>
    </div>

    <!-- SIGN IN PANEL -->
    <div class="tab-panel active" id="login-panel">
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <div class="form-input-icon">
            <span class="icon">
              <svg class="input-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            </span>
            <input id="login-email" class="form-input" type="email" placeholder="name@domain.com" required autocomplete="email" />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <div class="form-input-icon">
            <span class="icon">
              <svg class="input-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input id="login-password" class="form-input" type="password" placeholder="••••••••••••" required autocomplete="current-password" />
          </div>
        </div>
        <button type="submit" id="login-btn" class="btn btn-primary btn-full btn-lg mt-8">
          <span>Sign In to Platform</span>

    </div>

    <!-- CREATE ACCOUNT PANEL -->
    <div class="tab-panel" id="register-panel">
      <form id="register-form" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label class="form-label" for="reg-name">Full Name</label>
          <div class="form-input-icon">
            <span class="icon">
              <svg class="input-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
            <input id="reg-name" class="form-input" type="text" placeholder="Alex Morgan" required autocomplete="name" />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-email">Email Address</label>
          <div class="form-input-icon">
            <span class="icon">
              <svg class="input-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            </span>
            <input id="reg-email" class="form-input" type="email" placeholder="alex.morgan@campus.edu" required autocomplete="email" />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-password">Password</label>
          <div class="form-input-icon">
            <span class="icon">
              <svg class="input-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input id="reg-password" class="form-input" type="password" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password" />
          </div>
        </div>
        <button type="submit" id="register-btn" class="btn btn-primary btn-full btn-lg mt-8">
          <span>Create Aspirant Account</span>
        </button>
      </form>
    </div>

    <div class="auth-footer">
      <span>By continuing you agree to the GD Simulator Assessment Protocol.</span>
      <span>Enterprise Grade • Encrypted Evaluation Transcripts</span>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  let supabaseClient = null;

  // Check if already authenticated
  if (API.Auth.isLoggedIn()) {
    window.location.href = '/dashboard.html';
  }

  // Handle URL query params (e.g. ?tab=register)
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('tab') === 'register') {
    switchTab('register');
  }

  // Handle Supabase OAuth Redirect Callback
  async function checkAuthCallback() {
    // 1. Check for URL fragment tokens (#access_token=...) from Supabase
    const hash = window.location.hash.substring(1);
    const hashParams = new URLSearchParams(hash);
    const accessToken = hashParams.get('access_token');

    if (accessToken) {
      const badge = document.getElementById('auth-status-badge');
      const badgeText = document.getElementById('badge-text');
      badge.className = 'supabase-badge connected';
      badgeText.textContent = 'Syncing session...';

      try {
        await API.Auth.syncSupabaseSession(accessToken);
        AppUtils.showToast('Authentication confirmed! Redirecting...', 'success');
        setTimeout(() => window.location.href = '/dashboard.html', 400);
        return;
      } catch (err) {
        AppUtils.showToast('Failed to sync authentication: ' + err.message, 'error');
      }
    }

    // 2. Discover Supabase configuration from server
    try {
      const config = await API.Auth.getSupabaseConfig();
      const badge = document.getElementById('auth-status-badge');
      const badgeText = document.getElementById('badge-text');
      
      if (config && config.enabled && window.supabase) {
        supabaseClient = window.supabase.createClient(config.url, config.anonKey);
        badge.className = 'supabase-badge connected';
        badgeText.textContent = '⚡ Supabase Cloud Active';
        
        // Check if there is an active Supabase session
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session?.access_token && !API.Auth.isLoggedIn()) {
          await API.Auth.syncSupabaseSession(session.access_token);
          window.location.href = '/dashboard.html';
        }
      } else {
        badge.className = 'supabase-badge local';
        badgeText.textContent = '🔒 Local Database Mode';
      }
    } catch {
      const badge = document.getElementById('auth-status-badge');
      const badgeText = document.getElementById('badge-text');
      badge.className = 'supabase-badge local';
      badgeText.textContent = '🔒 Local Database Mode';
    }
  }

  checkAuthCallback();

  function switchTab(tab) {
    ['login', 'register'].forEach(t => {
      document.getElementById(`${t}-tab`).classList.toggle('active', t === tab);
      document.getElementById(`${t}-panel`).classList.toggle('active', t === tab);
    });
  }

  function fillDemoCredentials() {
    quickLoginCandidate('demo@gd.com', 'Alex Morgan');
  }

  async function quickLoginCandidate(email, name) {
    switchTab('login');
    document.getElementById('login-email').value = email;
    document.getElementById('login-password').value = 'demo123';
    AppUtils.showToast(`Signing in as ${name}...`, 'info', 1500);

    try {
      const res = await API.Auth.quickSwitch(email);
      if (res && res.token) {
        AppUtils.showToast(`Welcome back, ${res.user.name}!`, 'success', 2000);
        setTimeout(() => window.location.href = '/dashboard.html', 300);
      }
    } catch (err) {
      try {
        const res2 = await API.Auth.login(email, 'demo123');
        if (res2 && res2.token) {
          AppUtils.showToast(`Welcome back, ${res2.user.name}!`, 'success', 2000);
          setTimeout(() => window.location.href = '/dashboard.html', 300);
        }
      } catch (e) {
        AppUtils.showToast(`Credentials filled for ${name}. Click Sign In.`, 'info');
      }
    }
  }

  async function handleOAuthLogin(provider) {
    const btn = document.getElementById(`btn-oauth-${provider}`);
    const originalText = btn.innerHTML;
    btn.innerHTML = `<span class="spinner" style="width:14px;height:14px"></span> Signing in...`;
    btn.disabled = true;

    try {
      if (supabaseClient) {
        const { error } = await supabaseClient.auth.signInWithOAuth({
          provider: provider,
          options: {
            redirectTo: window.location.origin + '/login.html'
          }
        });
        if (error) throw error;
      } else {
        throw new Error('Supabase project credentials have not been configured yet. Update backend/.env with your Supabase credentials.');
      }
    } catch (err) {
      AppUtils.showToast(err.message, 'error');
      btn.innerHTML = originalText;
      btn.disabled = false;
    }
  }

  async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;

    btn.innerHTML = '<span class="spinner"></span> Authenticating...';
    btn.disabled = true;

    try {
      await API.Auth.login(email, password);
      AppUtils.showToast('Session verified. Redirecting...', 'success');
      setTimeout(() => window.location.href = '/dashboard.html', 400);
    } catch (err) {
      AppUtils.showToast(err.message, 'error');
      btn.innerHTML = '<span>Sign In to Platform</span>';
      btn.disabled = false;
    }
  }

  async function handleRegister(e) {
    e.preventDefault();
    const btn = document.getElementById('register-btn');
    const name = document.getElementById('reg-name').value;
    const email = document.getElementById('reg-email').value;
    const password = document.getElementById('reg-password').value;

    btn.innerHTML = '<span class="spinner"></span> Creating Account...';
    btn.disabled = true;

    try {
      await API.Auth.register(name, email, password);
      AppUtils.showToast('Account created successfully!', 'success');
      setTimeout(() => window.location.href = '/dashboard.html', 400);
    } catch (err) {
      AppUtils.showToast(err.message, 'error');
      btn.innerHTML = '<span>Create Aspirant Account</span>';
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
